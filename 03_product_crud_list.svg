<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <rect width="960" height="520" fill="#fbf9f6" rx="8"/>
  
  <text x="30" y="40" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#1c130e">Cafe Inventory Catalog (Coffee Beans, Dairy, Syrups &amp; Supplies)</text>

  <!-- Filter & Action Bar -->
  <g transform="translate(30, 60)">
    <rect width="900" height="95" rx="8" fill="#ffffff" stroke="#e6ded6"/>
    
    <!-- Row 1: Search Inputs -->
    <text x="15" y="30" font-family="'Segoe UI', sans-serif" font-size="12" fill="#5c3a21">Keyword:</text>
    <rect x="75" y="14" width="170" height="28" rx="4" fill="#fdfaf7" stroke="#e6ded6"/>
    <text x="85" y="32" font-family="'Segoe UI', sans-serif" font-size="11" fill="#856b5b">Search beans, syrups, SKU...</text>

    <text x="260" y="30" font-family="'Segoe UI', sans-serif" font-size="12" fill="#5c3a21">Category:</text>
    <rect x="320" y="14" width="140" height="28" rx="4" fill="#fdfaf7" stroke="#e6ded6"/>
    <text x="330" y="32" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">All Categories ▾</text>

    <text x="475" y="30" font-family="'Segoe UI', sans-serif" font-size="12" fill="#5c3a21">Status:</text>
    <rect x="525" y="14" width="120" height="28" rx="4" fill="#fdfaf7" stroke="#e6ded6"/>
    <text x="535" y="32" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">All Stock Levels ▾</text>

    <rect x="660" y="14" width="85" height="28" rx="4" fill="#5c3a21"/>
    <text x="702" y="32" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Filter Items</text>

    <rect x="755" y="14" width="90" height="28" rx="4" fill="#785947"/>
    <text x="800" y="32" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Reset Filters</text>

    <!-- Row 2: CRUD Buttons -->
    <line x1="10" y1="52" x2="890" y2="52" stroke="#f5ede4"/>

    <rect x="15" y="60" width="120" height="28" rx="4" fill="#5c3a21"/>
    <text x="75" y="78" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">+ Add Cafe Item</text>

    <rect x="145" y="60" width="85" height="28" rx="4" fill="#785947"/>
    <text x="187" y="78" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Edit Item</text>

    <rect x="240" y="60" width="95" height="28" rx="4" fill="#dc2626"/>
    <text x="287" y="78" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Delete Item</text>

    <rect x="345" y="60" width="165" height="28" rx="4" fill="#15803d"/>
    <text x="427" y="78" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Restock Delivery (Inbound)</text>

    <rect x="520" y="60" width="180" height="28" rx="4" fill="#b45309"/>
    <text x="610" y="78" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Bar Usage / Dispense (Outbound)</text>

    <rect x="710" y="60" width="85" height="28" rx="4" fill="#785947"/>
    <text x="752" y="78" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Refresh</text>
  </g>

  <!-- Table Body -->
  <g transform="translate(30, 175)">
    <rect width="900" height="320" rx="8" fill="#ffffff" stroke="#e6ded6"/>
    <rect width="900" height="34" rx="8" fill="#f5ede4"/>
    <text x="15" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#422815">SKU</text>
    <text x="110" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#422815">ITEM / INGREDIENT NAME</text>
    <text x="350" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#422815">CATEGORY</text>
    <text x="500" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#422815">COST</text>
    <text x="590" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#422815">PRICE</text>
    <text x="670" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#422815">STOCK</text>
    <text x="750" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#422815">REORDER</text>
    <text x="825" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#422815">STATUS</text>

    <!-- Sample row 1 -->
    <rect x="2" y="35" width="896" height="32" fill="#fdfaf7"/>
    <text x="15" y="56" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">CF-BN-001</text>
    <text x="110" y="56" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">Signature Espresso Blend (1kg Whole Bean)</text>
    <text x="350" y="56" font-family="'Segoe UI', sans-serif" font-size="11" fill="#856b5b">Coffee Beans &amp; Grounds</text>
    <text x="500" y="56" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">750.00</text>
    <text x="590" y="56" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">1,150.00</text>
    <text x="670" y="56" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">18 Bag</text>
    <text x="750" y="56" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">10</text>
    <text x="825" y="56" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#15803d">IN STOCK</text>

    <!-- Sample row 2 -->
    <text x="15" y="90" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">CF-MK-001</text>
    <text x="110" y="90" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">Barista Edition Oat Milk (1L Carton)</text>
    <text x="350" y="90" font-family="'Segoe UI', sans-serif" font-size="11" fill="#856b5b">Dairy &amp; Plant-Based Milk</text>
    <text x="500" y="90" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">145.00</text>
    <text x="590" y="90" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">210.00</text>
    <text x="670" y="90" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">5 Carton</text>
    <text x="750" y="90" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">15</text>
    <text x="825" y="90" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#b45309">LOW STOCK</text>
  </g>
</svg>
