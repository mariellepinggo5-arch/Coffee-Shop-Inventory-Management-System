<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <rect width="700" height="500" fill="#fbf9f6"/>
  <!-- Dialog Box -->
  <rect x="50" y="30" width="600" height="440" rx="10" fill="#ffffff" stroke="#e6ded6" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(62,39,35,0.1))"/>

  <!-- Modal Header (Espresso) -->
  <rect x="50" y="30" width="600" height="48" rx="10" fill="#5c3a21"/>
  <text x="75" y="61" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Add New Cafe Item to Inventory</text>

  <!-- Form Content -->
  <g transform="translate(80, 95)">
    <!-- Row 1 -->
    <text x="0" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#2c1d15">SKU / Code *:</text>
    <rect x="130" y="5" width="140" height="28" rx="4" fill="#fdfaf7" stroke="#e6ded6"/>
    <text x="140" y="23" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">CF-SY-004</text>

    <text x="290" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#2c1d15">Ingredient Name *:</text>
    <rect x="400" y="5" width="140" height="28" rx="4" fill="#fdfaf7" stroke="#e6ded6"/>
    <text x="410" y="23" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">Roasted Hazelnut Syrup (750ml)</text>

    <!-- Row 2 -->
    <text x="0" y="65" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#2c1d15">Category *:</text>
    <rect x="130" y="50" width="140" height="28" rx="4" fill="#fdfaf7" stroke="#e6ded6"/>
    <text x="140" y="68" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">Syrups &amp; Flavors ▾</text>

    <text x="290" y="65" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#2c1d15">Roaster / Vendor *:</text>
    <rect x="400" y="50" width="140" height="28" rx="4" fill="#fdfaf7" stroke="#e6ded6"/>
    <text x="410" y="68" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">SweetCraft Syrups ▾</text>

    <!-- Row 3 -->
    <text x="0" y="110" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#2c1d15">Cost Price (PHP):</text>
    <rect x="130" y="95" width="140" height="28" rx="4" fill="#fdfaf7" stroke="#e6ded6"/>
    <text x="140" y="113" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">380.00</text>

    <text x="290" y="110" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#2c1d15">Selling Price:</text>
    <rect x="400" y="95" width="140" height="28" rx="4" fill="#fdfaf7" stroke="#e6ded6"/>
    <text x="410" y="113" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">550.00</text>

    <!-- Row 4 -->
    <text x="0" y="155" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#2c1d15">Initial Quantity:</text>
    <rect x="130" y="140" width="140" height="28" rx="4" fill="#fdfaf7" stroke="#e6ded6"/>
    <text x="140" y="158" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">10</text>

    <text x="290" y="155" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#2c1d15">Reorder Alert:</text>
    <rect x="400" y="140" width="140" height="28" rx="4" fill="#fdfaf7" stroke="#e6ded6"/>
    <text x="410" y="158" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">5</text>

    <!-- Row 5 -->
    <text x="0" y="200" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#2c1d15">Unit of Measure:</text>
    <rect x="130" y="185" width="140" height="28" rx="4" fill="#fdfaf7" stroke="#e6ded6"/>
    <text x="140" y="203" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">Bottle ▾</text>

    <text x="290" y="200" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#2c1d15">Availability:</text>
    <rect x="400" y="185" width="140" height="28" rx="4" fill="#fdfaf7" stroke="#e6ded6"/>
    <text x="410" y="203" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">ACTIVE ▾</text>
  </g>

  <!-- Bottom Actions -->
  <rect x="50" y="415" width="600" height="55" rx="10" fill="#fbf9f6"/>
  <rect x="420" y="428" width="90" height="32" rx="4" fill="#785947"/>
  <text x="465" y="449" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Cancel</text>
  <rect x="525" y="428" width="110" height="32" rx="4" fill="#5c3a21"/>
  <text x="580" y="449" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Save Item</text>
</svg>
