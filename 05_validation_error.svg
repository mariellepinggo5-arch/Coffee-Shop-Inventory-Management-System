<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <rect width="600" height="350" fill="#fbf9f6"/>
  <!-- Warning Dialog Window -->
  <rect x="75" y="40" width="450" height="260" rx="8" fill="#ffffff" stroke="#e6ded6" stroke-width="2" filter="drop-shadow(0 8px 12px rgba(62,39,35,0.1))"/>
  
  <rect x="75" y="40" width="450" height="40" rx="8" fill="#b45309"/>
  <text x="95" y="66" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Cafe Validation Notice</text>

  <!-- Warning Icon -->
  <circle cx="130" cy="140" r="24" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="130" y="148" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="bold" fill="#b45309" text-anchor="middle">!</text>

  <!-- Message Content -->
  <text x="175" y="125" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#1c130e">Duplicate SKU Barcode Detected</text>
  <text x="175" y="150" font-family="'Segoe UI', sans-serif" font-size="12" fill="#5c3a21">A coffee item with SKU 'CF-BN-001' already exists.</text>
  <text x="175" y="170" font-family="'Segoe UI', sans-serif" font-size="12" fill="#856b5b">Please specify a unique SKU identifier for new stock.</text>

  <!-- OK Button -->
  <rect x="250" y="235" width="100" height="34" rx="4" fill="#5c3a21"/>
  <text x="300" y="257" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">OK</text>
</svg>
