<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <rect width="700" height="450" fill="#fbf9f6"/>
  <!-- Stock Movement Dialog -->
  <rect x="75" y="30" width="550" height="390" rx="10" fill="#ffffff" stroke="#e6ded6" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(62,39,35,0.1))"/>

  <!-- Modal Header (Espresso) -->
  <rect x="75" y="30" width="550" height="60" rx="10" fill="#5c3a21"/>
  <text x="100" y="58" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Log Cafe Stock Movement</text>
  <text x="100" y="78" font-family="'Segoe UI', sans-serif" font-size="11" fill="#ede2d8">[CF-MK-001] Barista Edition Oat Milk | On Hand: 5 Carton</text>

  <!-- Form Fields -->
  <g transform="translate(100, 115)">
    <text x="0" y="25" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#2c1d15">Movement Type *:</text>
    <rect x="180" y="8" width="190" height="30" rx="4" fill="#fdfaf7" stroke="#e6ded6"/>
    <text x="195" y="28" font-family="'Segoe UI', sans-serif" font-size="12" fill="#1c130e">INBOUND (Delivery) ▾</text>

    <text x="0" y="75" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#2c1d15">Delivery Received (Carton):</text>
    <rect x="180" y="58" width="100" height="30" rx="4" fill="#fdfaf7" stroke="#e6ded6"/>
    <text x="195" y="78" font-family="'Segoe UI', sans-serif" font-size="12" fill="#1c130e">20</text>

    <text x="0" y="125" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#2c1d15">Delivery / Invoice Ref:</text>
    <rect x="180" y="108" width="190" height="30" rx="4" fill="#fdfaf7" stroke="#e6ded6"/>
    <text x="195" y="128" font-family="'Segoe UI', sans-serif" font-size="12" fill="#1c130e">PO-OAT-2026-04</text>

    <text x="0" y="175" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#2c1d15">Barista Notes / Reason:</text>
    <rect x="180" y="158" width="280" height="55" rx="4" fill="#fdfaf7" stroke="#e6ded6"/>
    <text x="195" y="180" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">Fresh stock from Valley Dairy Distributors</text>
  </g>

  <!-- Bottom Buttons -->
  <rect x="75" y="360" width="550" height="60" rx="10" fill="#fbf9f6"/>
  <rect x="360" y="375" width="80" height="32" rx="4" fill="#785947"/>
  <text x="400" y="396" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Cancel</text>
  <rect x="455" y="375" width="150" height="32" rx="4" fill="#15803d"/>
  <text x="530" y="396" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Confirm Movement</text>
</svg>
