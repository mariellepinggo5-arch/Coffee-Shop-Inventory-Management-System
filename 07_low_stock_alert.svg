<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <rect width="960" height="460" fill="#fbf9f6" rx="8"/>
  
  <text x="30" y="40" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#b91c1c">Urgent Low Stock &amp; Reorder Alerts (Cafe Supplies)</text>

  <!-- Action Bar -->
  <g transform="translate(30, 60)">
    <rect width="900" height="50" rx="8" fill="#ffffff" stroke="#e6ded6"/>
    <rect x="15" y="10" width="220" height="30" rx="4" fill="#15803d"/>
    <text x="125" y="30" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Order Restock for Selected Item</text>

    <rect x="245" y="10" width="130" height="30" rx="4" fill="#785947"/>
    <text x="310" y="30" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Refresh Alert Status</text>
  </g>

  <!-- Table Body -->
  <g transform="translate(30, 125)">
    <rect width="900" height="300" rx="8" fill="#ffffff" stroke="#e6ded6"/>
    <rect width="900" height="34" rx="8" fill="#fee2e2"/>
    <text x="15" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#991b1b">SKU</text>
    <text x="130" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#991b1b">INGREDIENT / SUPPLY NAME</text>
    <text x="420" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#991b1b">CATEGORY</text>
    <text x="590" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#991b1b">STOCK</text>
    <text x="680" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#991b1b">THRESHOLD</text>
    <text x="790" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#991b1b">DEFICIT</text>

    <!-- Row 1: Oat Milk -->
    <rect x="2" y="35" width="896" height="34" fill="#fff1f2"/>
    <text x="15" y="57" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">CF-MK-001</text>
    <text x="130" y="57" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">Barista Edition Oat Milk (1L Carton)</text>
    <text x="420" y="57" font-family="'Segoe UI', sans-serif" font-size="11" fill="#856b5b">Dairy &amp; Plant Milk</text>
    <text x="590" y="57" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#dc2626">5</text>
    <text x="680" y="57" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">15</text>
    <text x="790" y="57" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">-10 Cartons</text>

    <!-- Row 2: Salted Caramel -->
    <text x="15" y="92" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">CF-SY-002</text>
    <text x="130" y="92" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">Salted Caramel Gourmet Sauce (1L)</text>
    <text x="420" y="92" font-family="'Segoe UI', sans-serif" font-size="11" fill="#856b5b">Syrups &amp; Flavorings</text>
    <text x="590" y="92" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#dc2626">4</text>
    <text x="680" y="92" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">8</text>
    <text x="790" y="92" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">-4 Bottles</text>

    <!-- Row 3: Ceremonial Matcha -->
    <text x="15" y="127" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">CF-SY-003</text>
    <text x="130" y="127" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">Ceremonial Grade Uji Matcha Powder (500g)</text>
    <text x="420" y="127" font-family="'Segoe UI', sans-serif" font-size="11" fill="#856b5b">Syrups &amp; Flavorings</text>
    <text x="590" y="127" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#dc2626">3</text>
    <text x="680" y="127" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1c130e">5</text>
    <text x="790" y="127" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">-2 Tins</text>
  </g>
</svg>
